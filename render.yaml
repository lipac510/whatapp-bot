services:
  - type: web
    name: wa-customer-info-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GRAPH_API_VERSION
        value: v25.0
      - key: BUSINESS_NAME
        value: Lipack Packaging
      - key: ADMIN_PASSWORD
        sync: false
      - key: TIMEZONE
        value: America/Los_Angeles
      - key: PUBLIC_BASE_URL
        value: https://wa-customer-info-bot.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: IG_PAGE_ID
        sync: false
      - key: IG_PAGE_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: OKKI_API_BASE
        value: https://api-sandbox.xiaoman.cn
      - key: OKKI_SCOPE
        value: company
      - key: OKKI_CLIENT_ID
        sync: false
      - key: OKKI_CLIENT_SECRET
        sync: false
      - key: OKKI_ORIGIN_ID
        sync: false
      - key: OKKI_OWNER_USER_ID
        sync: false
      - key: OKKI_INQUIRY_SUMMARY_FIELD_ID
        sync: false
      - key: OKKI_PURCHASE_QUANTITY_FIELD_ID
        sync: false
      - key: OKKI_INQUIRY_PRODUCT_FIELD_ID
        sync: false
